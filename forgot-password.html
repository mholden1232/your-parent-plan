<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset your password — Your Parent Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link href="home.css" rel="stylesheet"/>
<link href="styles.css" rel="stylesheet"/>
</head>
<body class="home">
<main class="auth-page">
  <div class="auth-shell">
    <a class="auth-logo" href="index.html">Your Parent Plan</a>
    <section class="auth-card">
      <div class="eyebrow">Forgot your password?</div>
      <h1>Reset your password</h1>
      <p>Enter the email you signed up with and we’ll send a link to choose a new password.</p>
      <div id="authMessage" class="auth-message" role="status"></div>
      <form id="forgotForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <button class="btn primary" type="submit">Send reset link</button>
      </form>
      <div class="auth-switch">Remembered it? <a href="login.html"><b>Sign in</b></a></div>
    </section>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="account-recovery.js"></script>
</body>
</html>
