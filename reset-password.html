<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose a new password — Your Parent Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link href="home.css" rel="stylesheet"/>
<link href="styles.css" rel="stylesheet"/>
</head>
<body class="home">
<main class="auth-page">
  <div class="auth-shell">
    <a class="auth-logo" href="index.html">Your Parent Plan</a>
    <section class="auth-card">
      <div class="eyebrow">Almost done</div>
      <h1>Choose a new password</h1>
      <div id="authMessage" class="auth-message" role="status"></div>
      <form id="resetForm">
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required>
      <label for="confirmPassword">Re-enter new password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
      <button class="btn primary" type="submit">Save new password</button>
      </form>
      <div class="auth-switch"><a href="forgot-password.html"><b>Send a new reset link</b></a></div>
    </section>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="account-recovery.js"></script>
</body>
</html>
